version: '3.8'

services:
  # ---------------------------------------------------------------
  # PostgreSQL + PostGIS (primary spatial database)
  # ---------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: asaas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: asaas_user
      POSTGRES_PASSWORD: asaas_secret          # TODO: change in production
      POSTGRES_DB: asaas_db
    volumes:
      - asaas-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asaas_user -d asaas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Redis (real-time Pub/Sub bus)
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: asaas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - asaas-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asaas-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=false
      - FRONTEND_ORIGIN=http://localhost
      - DATABASE_URL=postgresql+asyncpg://asaas_user:asaas_secret@db:5432/asaas_db
      - REDIS_URL=redis://redis:6379/0
      # TODO: Set a strong JWT_SECRET_KEY before deploying to production
      - JWT_SECRET_KEY=CHANGE_ME_set_a_strong_secret_here
      - JWT_EXPIRE_MINUTES=60
      - OSRM_BASE_URL=http://router.project-osrm.org
      # TODO: Add Twilio credentials for SMS alerts
      # - TWILIO_ACCOUNT_SID=
      # - TWILIO_AUTH_TOKEN=
      # - TWILIO_FROM_NUMBER=
    volumes:
      - asaas-backend-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ---------------------------------------------------------------
  # React Frontend (Nginx)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: asaas-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  asaas-pgdata:
  asaas-redis-data:
  asaas-backend-data:
