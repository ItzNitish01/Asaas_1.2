version: '3.8'

services:
  asaas-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: asaas-backend-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MQTT_BROKER_URL=mqtt://broker.emqx.io:1883
    volumes:
      - asaas-data:/app/data

  asaas-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: asaas-frontend-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - asaas-backend

volumes:
  asaas-data:
